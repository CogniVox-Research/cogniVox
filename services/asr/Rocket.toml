[default]
address = "0.0.0.0"
port=8001

[default.asr]
backend="whisper"
model="Tiny"
vad="Silero"
model_dir="./models"
segment_buffer=2
silence_threshold=2

[default.file_store]
type="s3"
endpoint="http://localhost:8333"
bucket="cg-data"
access_key_id="admin_access_key"
secret_access_key="admin_secret_key"

[default.rabbitmq]
url="amqp://appuser:apppass@localhost"
connection_name="asr"
