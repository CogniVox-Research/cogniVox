[project]
name = "auth-service"
version = "0.1.0"
description = "CogniVox authentication service"
requires-python = ">=3.12"

[tool.poetry]
name = "auth-service"
version = "0.1.0"
description = "CogniVox authentication service"
authors = []
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12"
fastapi = { extras = ["standard"], version = "^0.115.0" }
pydantic = "^2.10.0"
pydantic-settings = "^2.7.0"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
bcrypt = "^4.2.0"
cryptography = "^43.0.0"
sqlalchemy = "^2.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
