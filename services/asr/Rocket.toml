[default]
address = "0.0.0.0"
port=8001

[default.asr]
backend="whisper"
model="Tiny"
vad="Silero"
model_dir="./models"
segment_buffer=2
silence_threshold=2

[default.recording_store]
type="s3"
endpoint="http://seaweedfs:8333"
bucket="cg-data"
access_key_id="admin_access_key"
secret_access_key="admin_secret_key"

[release.rabbitmq]
address="amqp://appuser:apppass@rabbitmq"
connection_name="asr"
