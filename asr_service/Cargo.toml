[package]
name = "asr_service"
version = "0.1.0"
edition = "2024"

[features]
cuda=["asr_rs/cuda"]
vulkan=["asr_rs/vulkan"]
ffmpeg=["dep:ffmpeg-next", "dep:ffmpeg-sys-next","dep:ez-ffmpeg"]
symphonia=["dep:symphonia", "dep:hound"]
build-ffmpeg=["ffmpeg", "ffmpeg-next/build"]
default=["cuda", "ffmpeg", "build-ffmpeg"]

[dependencies]
rocket = "0.5.1"
rocket_ws = "0.1.1"
serde = { version = "1.0.228", features = ["derive"] }
asr_rs = { git = "https://github.com/yehan2002/asr_rs.git" }
bytes = "1.11.1"
thiserror = "2.0.18"
serde_json = "1.0.149"
object_store = "0.13.1"
tempdir = "0.3.7"

ez-ffmpeg = {version="0.10.0", optional=true}
ffmpeg-next = {version="7.1.0", optional=true}
ffmpeg-sys-next ={version= "7.1.0", optional=true}
symphonia = {version="0.5.5", optional=true}
hound = {version="3.5.1", optional=true}
fern = "0.7.1"
log = "0.4.29"
