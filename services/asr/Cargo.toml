[package]
name = "asr_service"
version = "0.1.0"
edition = "2024"

[features]
cuda=["asr_rs/cuda"]
vulkan=["asr_rs/vulkan"]
rust_audio=["dep:webm-iterable", "dep:opus","dep:rubato"]
default=["rust_audio"]

[dependencies]
rocket = "0.5.1"
rocket_ws = "0.1.1"
serde = { version = "1.0.228", features = ["derive"] }
asr_rs = { git = "https://github.com/yehan2002/asr_rs.git", features=[ "async"]}
bytes = "1.11.1"
thiserror = "2.0.18"
serde_json = "1.0.149"
object_store = "0.13.1"
tempdir = "0.3.7"
common = { path="../../lib/common" }
once_cell = "1.21.3"
hound = "3.5.1"

webm-iterable = {version="0.6", optional=true}
opus ={version= "0.3", optional=true}
rubato = {version="0.14", optional=true}

fern = "0.7.1"
log = "0.4.29"
anyhow = "1.0.101"
tar = {version="0.4.44", no_default_features=true}
byteorder = "1.5.0"
