services:
  transcript_analysis_service:
    image: ghcr.io/cognivox-research/transcript_analysis_service:v0.0.2
    restart: "unless-stopped"
    ports:
      - "8005:8005"

    build:
      context: ../
      dockerfile: ./services/transcript_analysis/Dockerfile

    volumes:
      - ./config/transcript_analysis.toml:/app/services/transcript_analysis/config.toml:ro
      - ../services/transcript_analysis/models:/app/services/transcript_analysis/models
