[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log

[program:rabbitmq]
command=rabbitmq-server
autostart=true
autorestart=true
startsecs=10
priority=10
stdout_logfile=/var/log/rabbitmq-stdout.log
stderr_logfile=/var/log/rabbitmq-stderr.log
environment=RABBITMQ_DEFAULT_USER="%(ENV_RABBITMQ_DEFAULT_USER)s",RABBITMQ_DEFAULT_PASS="%(ENV_RABBITMQ_DEFAULT_PASS)s"

[program:seaweedfs]
command=weed mini -s3.config=/etc/seaweedfs/s3.json
autostart=true
autorestart=true
startsecs=5
priority=20
stdout_logfile=/var/log/seaweedfs-stdout.log
stderr_logfile=/var/log/seaweedfs-stderr.log
